name: Scientific checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-regeneration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      SCIENCE_OUTPUT: ${{ runner.temp }}/cbcqv-scientific-output
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bounded offline tests and whole scientific regeneration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SCIENCE_OUTPUT"
          export TMPDIR="$SCIENCE_OUTPUT"
          ulimit -v 2097152
          ulimit -t 300
          ulimit -f 131072
          timeout --signal=TERM --kill-after=10s 300s bash -euo pipefail <<'CHECKS' 2>&1 | tee "$SCIENCE_OUTPUT/whole-run.log"
          python -B -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$SCIENCE_OUTPUT/tests.log"
          python -B src/generate_corpus.py --output "$SCIENCE_OUTPUT/corpus.json" 2>&1 | tee "$SCIENCE_OUTPUT/corpus.log"
          python -B src/compare.py --reference-corpus data/corpus.json --candidate-corpus "$SCIENCE_OUTPUT/corpus.json" 2>&1 | tee "$SCIENCE_OUTPUT/corpus-comparison.log"
          python -B src/run.py --corpus "$SCIENCE_OUTPUT/corpus.json" --output "$SCIENCE_OUTPUT/results" 2>&1 | tee "$SCIENCE_OUTPUT/campaign.log"
          python -B src/micro_exhaustive.py --output "$SCIENCE_OUTPUT/results/micro-exhaustive.json" 2>&1 | tee "$SCIENCE_OUTPUT/micro.log"
          python -B src/verify_bundle.py --corpus "$SCIENCE_OUTPUT/corpus.json" --results "$SCIENCE_OUTPUT/results" 2>&1 | tee "$SCIENCE_OUTPUT/replay.log"
          python -B src/compare.py results/frozen "$SCIENCE_OUTPUT/results" 2>&1 | tee "$SCIENCE_OUTPUT/comparison.log"
          CHECKS
      - name: Retain raw outputs even after a failed gate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-raw-output
          path: ${{ runner.temp }}/cbcqv-scientific-output
          if-no-files-found: warn
          retention-days: 14
